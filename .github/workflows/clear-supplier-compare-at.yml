name: Clear Tluxy/Loxuno compare-at prices (manual, one-off)
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually clear them? (false = dry run)"
        type: boolean
        default: false
concurrency:
  group: shopify-channable-sync
  cancel-in-progress: false
jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Clear compare-at prices
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_STORE: siebentaschen.myshopify.com
        run: python clear_supplier_compare_at.py ${{ inputs.apply && '--apply' || '' }}
